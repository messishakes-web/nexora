{% extends 'students/base.html' %}

{% block content %}
<!-- The main container handles the swipe -->
<div id="lockscreen" class="flex-1 flex flex-col items-center justify-center p-6 h-full w-full relative bg-cover bg-center transition-transform duration-300 cursor-pointer" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop');">
    
    <!-- Dark overlay so text is readable -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Clock and Date -->
    <div class="text-center mb-20 z-10 pointer-events-none">
        <h1 id="clock" class="text-9xl font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
        <p id="date" class="text-2xl text-white/80 mt-4 font-semibold tracking-wide">Loading date...</p>
    </div>

    <!-- Swipe Up Indicator (Also a clickable link as a fallback) -->
    <a href="/students/student-login/" class="absolute bottom-16 flex flex-col items-center text-white/70 hover:text-white z-10 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 animate-bounce mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
        <span class="text-lg font-semibold tracking-widest uppercase">Swipe up to unlock</span>
    </a>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Update the clock
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-KE', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Handle the Swipe Up
    const lockscreen = document.getElementById('lockscreen');
    let startY = 0;

    // For touchscreens
    lockscreen.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
    });

    lockscreen.addEventListener('touchend', e => {
        let endY = e.changedTouches[0].clientY;
        // If swiped up more than 50 pixels
        if (startY - endY > 50) {
            window.location.href = '/students/student-login/';
        }
    });

    // For mouse (so you can test on your laptop)
    lockscreen.addEventListener('mousedown', e => {
        startY = e.clientY;
    });

    lockscreen.addEventListener('mouseup', e => {
        let endY = e.clientY;
        // If dragged up more than 50 pixels
        if (startY - endY > 50) {
            window.location.href = '/students/student-login/';
        }
    });
</script>
{% endblock %}
