{% extends 'students/base.html' %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center p-6 h-full w-full relative bg-gray-900">
    
    <!-- Live Clock -->
    <div class="text-center mb-20 z-10">
        <h1 id="clock" class="text-9xl font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
        <p id="date" class="text-2xl text-blue-300 mt-4 font-semibold tracking-wide">Loading date...</p>
    </div>

    <!-- Failsafe Button (Direct HTML Link) -->
    <a href="/students/student-login/" class="z-10 inline-flex items-center justify-center px-16 py-8 text-2xl font-bold text-white bg-blue-600 rounded-full hover:bg-blue-500 shadow-[0_0_50px_rgba(37,99,235,0.5)]">
        Tap to Make a Call
    </a>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-KE', options);
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
{% endblock %}
