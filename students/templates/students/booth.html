{% extends 'students/base.html' %}

{% block content %}
 <div class="flex-1 flex flex-col items-center justify-center p-6 h-full w-full max-w-md mx-auto relative">
    
    <!-- Live Clock -->
    <div class="text-center mb-20">
        <h1 id="clock" class="text-9xl font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
        <p id="date" class="text-2xl text-blue-300 mt-4 font-semibold tracking-wide">Loading date...</p>
    </div>

    <!-- Tap to start button -->
    <a href="{
    </a>

    <!-- Nexora Branding -->
    <div class="absolute bottom-10 text-gray-500 font-bold tracking-widest uppercase text-sm flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        System Online
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function updateClock() {
        const now = new Date();
        
        // Time (e.g., 14:30)
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        
        // Date (e.g., Monday, November 20, 2026)
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-KE', options);
    }
    
    // Update every second
    setInterval(updateClock, 1000);
    updateClock();
</script>
{% endblock %}
