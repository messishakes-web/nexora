
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora | Lockscreen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            color: white;
            background: #06101f;
        }

        .lockscreen {
            position: relative;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease;
        }

        .lockscreen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.25),
                transparent 40%,
                rgba(0,0,0,0.35)
            );
        }

        .top-bar {
            position: absolute;
            top: 35px;
            left: 55px;
            right: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .brand {
            font-size: 28px;
            letter-spacing: 9px;
            font-weight: 300;
        }

       .system-icons {
           display: flex;
           align-items: center;
           gap: 18px;
           font-size: 19px;
           letter-spacing: 0;
           color: white;
       }

        .clock-area {
            position: absolute;
            top: 19%;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .date {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .time {
            font-size: clamp(90px, 13vw, 180px);
            font-weight: 200;
            letter-spacing: 8px;
            line-height: 1;
        }

        .unlock-area {
            position: absolute;
            bottom: 8%;
            width: 100%;
            text-align: center;
            z-index: 2;
            cursor: grab;
            user-select: none;
        }

        .arrows {
            font-size: 42px;
            line-height: 35px;
            animation: float 1.5s infinite;
        }

        .unlock-text {
            font-size: 23px;
            letter-spacing: 3px;
            margin-top: 15px;
        }

        .unlock-lines {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 12px;
        }

        .unlock-lines span {
            width: 100px;
            height: 1px;
            background: rgba(255,255,255,0.7);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 700px) {
            .top-bar {
                left: 20px;
                right: 20px;
            }

            .brand {
                font-size: 20px;
            }

            .date {
                font-size: 18px;
            }

            .unlock-text {
                font-size: 16px;
            }
        }
        .system-icons {
            display: flex !important;
            align-items: center;
            justify-content: center;
            gap: 18px;
            color: white;
            position: relative;
            z-index: 10;
        }

         .system-icons svg {
            display: inline-block !important;
            width: 24px !important;
            height: 24px !important;
            min-width: 24px;
            min-height: 24px;
            flex-shrink: 0;
            overflow: visible;
        }

          #batteryIcon {
            width: 29px !important;
            height: 20px !important;
        }

          #batteryLevel {
            display: inline-block;
            font-size: 17px;
            color: white;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div class="lockscreen" id="lockscreen">

    <div class="top-bar">
        <div class="brand">NEXORA</div>
        <div class="system-icons">

    <!-- Wi-Fi icon -->
    <svg id="wifiIcon" viewBox="0 0 24 24">
        <path d="M2 8.5C7.5 3.5 16.5 3.5 22 8.5"
              fill="none" stroke="white" stroke-width="2"
              stroke-linecap="round"/>
        <path d="M5 12C9 8.5 15 8.5 19 12"
              fill="none" stroke="white" stroke-width="2"
              stroke-linecap="round"/>
        <path d="M8.5 15.5C10.5 13.8 13.5 13.8 15.5 15.5"
              fill="none" stroke="white" stroke-width="2"
              stroke-linecap="round"/>
        <circle cx="12" cy="19" r="1.5" fill="white"/>
    </svg>

    <!-- Mobile signal icon -->
    <svg id="signalIcon" viewBox="0 0 24 24">
        <rect x="2" y="16" width="3.5" height="6" rx="0.7" fill="white"/>
        <rect x="7" y="12" width="3.5" height="10" rx="0.7" fill="white"/>
        <rect x="12" y="8" width="3.5" height="14" rx="0.7" fill="white"/>
        <rect x="17" y="3" width="3.5" height="19" rx="0.7" fill="white"/>
    </svg>

    <!-- Battery icon -->
    <svg id="batteryIcon" viewBox="0 0 28 18">
        <rect x="1" y="2" width="22" height="14" rx="2"
              fill="none" stroke="white" stroke-width="1.5"/>
        <rect x="24" y="6" width="3" height="6" rx="1" fill="white"/>
        <rect id="batteryFill" x="3" y="4" width="18" height="10"
              rx="1" fill="#ffffff"/>
        <path id="chargingBolt"
              d="M13 4 L9 10 H12 L11 14 L17 8 H14 L16 4 Z"
              fill="#06101f" style="display:none"/>
    </svg>

    <span id="batteryLevel">--%</span>

</div>
    </div>

    <div class="clock-area">
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
    </div>

    <div class="unlock-area" id="unlockArea">
        <div class="arrows">⌃<br>⌃</div>

        <div class="unlock-lines">
            <span></span>
            <div class="unlock-text">Swipe up to unlock</div>
            <span></span>
        </div>
    </div>

</div>

<script>
    // Four daily wallpapers
    const wallpapers = [
        "{% static 'students/wallpapers/wallpaper1.jpg' %}",
        "{% static 'students/wallpapers/wallpaper2.jpg' %}",
        "{% static 'students/wallpapers/wallpaper3.jpg' %}",
        "{% static 'students/wallpapers/wallpaper4.jpg' %}"
    ];

    // Same wallpaper throughout each calendar day
    const today = new Date();
    const startOfYear = new Date(today.getFullYear(), 0, 0);
    const dayNumber = Math.floor(
        (today - startOfYear) / 86400000
    );

    const wallpaperIndex = dayNumber % wallpapers.length;

    document.getElementById("lockscreen").style.backgroundImage =
        `url("${wallpapers[wallpaperIndex]}")`;

    // Live clock and date
    function updateClock() {
        const now = new Date();

        document.getElementById("time").textContent =
            now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

        document.getElementById("date").textContent =
            now.toLocaleDateString("en-GB", {
                weekday: "short",
                month: "short",
                day: "numeric"
            });
    }

    updateClock();
    setInterval(updateClock, 1000);

    // Swipe-up interaction
    let startY = 0;
    const lockscreen = document.getElementById("lockscreen");

    lockscreen.addEventListener("touchstart", function(event) {
        startY = event.touches[0].clientY;
    });

    lockscreen.addEventListener("touchend", function(event) {
        const endY = event.changedTouches[0].clientY;

        if (startY - endY > 100) {
            window.location.href = "/student-login/";
        }
    });

    // Mouse swipe for desktop testing
    lockscreen.addEventListener("mousedown", function(event) {
        startY = event.clientY;
    });

    lockscreen.addEventListener("mouseup", function(event) {
        if (startY - event.clientY > 100) {
            window.location.href = "/student-login/";
        }
    });

    // NETWORK CONNECTION STATUS
function updateNetworkStatus() {
    const wifiIcon = document.getElementById("wifiIcon");

    if (navigator.onLine) {
        wifiIcon.style.opacity = "1";
        wifiIcon.title = "Network connection available";
    } else {
        wifiIcon.style.opacity = "0.3";
        wifiIcon.title = "Offline";
    }
}

window.addEventListener("online", updateNetworkStatus);
window.addEventListener("offline", updateNetworkStatus);

updateNetworkStatus();


// BATTERY STATUS
// BATTERY STATUS
async function updateBatteryStatus() {
    const batteryFill = document.getElementById("batteryFill");
    const batteryLevel = document.getElementById("batteryLevel");
    const chargingBolt = document.getElementById("chargingBolt");

    if (!navigator.getBattery) {
        batteryLevel.textContent = "--%";
        return;
    }

    try {
        const battery = await navigator.getBattery();

        function refreshBattery() {
            const percentage = Math.round(battery.level * 100);

            // Update percentage
            batteryLevel.textContent = percentage + "%";

            // Update the graphical battery fill
            batteryFill.setAttribute(
                "width",
                18 * percentage / 100
            );

            // Show charging bolt when charging
            chargingBolt.style.display =
                battery.charging ? "block" : "none";

            // Change battery fill when charge is low
            batteryFill.setAttribute(
                "fill",
                percentage <= 20 ? "#ff4444" : "white"
            );
        }

        refreshBattery();

        battery.addEventListener("levelchange", refreshBattery);
        battery.addEventListener("chargingchange", refreshBattery);

    } catch (error) {
        batteryLevel.textContent = "--%";
    }
}

updateBatteryStatus();
</script>

</body>
</html>
