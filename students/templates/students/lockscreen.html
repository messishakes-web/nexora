{% extends 'students/base.html' %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-between p-6 h-full w-full relative bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop');">
    
    <!-- Dark overlay for readability -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Top Status Bar (Time, Wifi, Battery) -->
    <div class="w-full flex justify-between items-center z-10 px-4 mt-2">
        <!-- Nexora Logo/Name -->
        <div class="text-white font-bold tracking-widest text-xl drop-shadow-md">NEXORA</div>
        
        <!-- Icons -->
        <div class="flex items-center gap-4 text-white">
            <!-- Wifi Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
            </svg>
            <!-- Network/Cellular Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            <!-- Battery Icon & Percentage -->
            <div class="flex items-center gap-1">
                <span class="text-sm font-semibold">31%</span>
                <div class="w-8 h-4 border-2 border-white rounded-sm relative flex items-center p-[1px]">
                    <div class="h-full w-1/3 bg-white rounded-[1px]"></div>
                    <div class="absolute -right-[4px] top-1/2 -translate-y-1/2 w-[2px] h-2 bg-white rounded-r-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Clock and Date (Center) -->
    <div class="text-center z-10 pointer-events-none mt-10">
        <p id="date" class="text-xl md:text-2xl text-white/90 font-semibold tracking-wide mb-2">Loading date...</p>
        <h1 id="clock" class="text-[8rem] leading-none font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
    </div>

    <!-- Fingerprint Long-Press Area (Bottom) -->
    <div class="w-full flex flex-col items-center z-10 mb-12">
        
        <div id="fingerprint-btn" class="relative flex items-center justify-center w-24 h-24 rounded-full bg-white/10 backdrop-blur-md border border-white/20 cursor-pointer select-none touch-none transition-transform duration-100 active:scale-95 group">
            
            <!-- SVG Progress Ring -->
            <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                <circle cx="48" cy="48" r="46" stroke="transparent" stroke-width="4" fill="transparent" />
                <circle id="progress-ring" cx="48" cy="48" r="46" stroke="#3b82f6" stroke-width="4" fill="transparent" stroke-dasharray="289" stroke-dashoffset="289" class="transition-all duration-75 ease-linear" />
            </svg>

            <!-- Fingerprint Icon -->
            <svg id="fingerprint-icon" xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white/80 group-hover:text-white transition-colors z-10 relative" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
            </svg>
        </div>
        <p class="mt-6 text-white/60 text-sm tracking-widest uppercase font-semibold">Hold to Unlock</p>
    </div>
    
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Update the clock
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-KE', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Handle the Long Press Unlock
    const btn = document.getElementById('fingerprint-btn');
    const progressRing = document.getElementById('progress-ring');
    const fingerprintIcon = document.getElementById('fingerprint-icon');
    
    let pressTimer;
    let progressTimer;
    let progress = 0;
    const maxProgress = 289; // Circumference of the circle
    const holdTime = 3000; // 3 seconds

    function startPress(e) {
        e.preventDefault(); // Prevent scrolling/selection on touch
        progress = 0;
        progressRing.style.strokeDashoffset = maxProgress;
        fingerprintIcon.classList.add('text-blue-400');

        // Animate the ring filling up over 3 seconds
        const intervalTime = 30; // update every 30ms
        const steps = holdTime / intervalTime;
        const stepSize = maxProgress / steps;

        progressTimer = setInterval(() => {
            progress += stepSize;
            progressRing.style.strokeDashoffset = maxProgress - progress;
        }, intervalTime);

        // Trigger unlock after 3 seconds
        pressTimer = setTimeout(() => {
            clearInterval(progressTimer);
            fingerprintIcon.classList.replace('text-blue-400', 'text-green-400');
            // Add a quick flash effect before redirecting
            btn.classList.replace('bg-white/10', 'bg-green-500/20');
            setTimeout(() => {
                window.location.href = '/students/student-login/';
            }, 200);
        }, holdTime);
    }

    function cancelPress(e) {
        if(e) e.preventDefault();
        clearTimeout(pressTimer);
        clearInterval(progressTimer);
        
        // Reset ring smoothly
        progressRing.style.strokeDashoffset = maxProgress;
        fingerprintIcon.classList.remove('text-blue-400');
        
        // Only reset background if we haven't unlocked yet
        if (progress < maxProgress) {
            btn.classList.replace('bg-green-500/20', 'bg-white/10');
        }
    }

    // Mouse events
    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('mouseup', cancelPress);
    btn.addEventListener('mouseleave', cancelPress);

    // Touch events
    btn.addEventListener('touchstart', startPress, {passive: false});
    btn.addEventListener('touchend', cancelPress);
    btn.addEventListener('touchcancel', cancelPress);
</script>
{% endblock %}
