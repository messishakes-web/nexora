{% extends 'students/base.html' %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-between p-6 h-full w-full relative bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop');">
    
    <!-- Dark overlay for readability -->
    <div class="absolute inset-0 bg-black/60"></div>

    <!-- Clock and Date (Top/Middle) -->
    <div class="text-center mt-32 z-10 pointer-events-none">
        <h1 id="clock" class="text-8xl md:text-9xl font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
        <p id="date" class="text-xl md:text-2xl text-blue-300 mt-4 font-semibold tracking-wide">Loading date...</p>
    </div>

    <!-- Unlock Area (Bottom) -->
    <div class="w-full flex flex-col items-center z-10 mb-8">
        
        <!-- The Tap Link -->
        <a href="/students/student-login/" class="group flex flex-col items-center justify-center w-full py-6 cursor-pointer">
            <!-- Up Arrow -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white/80 animate-bounce mb-2 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
            <!-- Text -->
            <span class="text-xl font-bold tracking-widest uppercase text-white/80 group-hover:text-white transition-colors">
                Tap to Unlock
            </span>
        </a>

        <!-- Nexora Branding -->
        <div class="mt-4 text-gray-500 font-bold tracking-widest uppercase text-xs flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            System Online
        </div>
    </div>
    
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Update the clock
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-KE', options);
    }
    
    setInterval(updateClock, 1000);
    updateClock();
</script>
{% endblock %}
