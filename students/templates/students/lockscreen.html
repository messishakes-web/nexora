{% extends 'students/base.html' %}
{% load static %}

{% block content %}
<!-- The background image is set dynamically by JavaScript below -->
<div id="lockscreen-bg" class="flex-1 flex flex-col items-center justify-between p-6 h-full w-full relative bg-cover bg-center transition-all duration-1000" style="background-image: url('{% static 'students/wallpapers/wallpaper1.jpg' %}');">
    
    <!-- Dark overlay for readability -->
    <div class="absolute inset-0 bg-black/40"></div>

    <!-- Top Status Bar -->
    <div class="w-full flex justify-between items-center z-10 px-4 mt-2">
        <!-- Nexora Logo/Name -->
        <div class="text-white font-bold tracking-widest text-lg drop-shadow-md">NEXORA</div>
        
        <!-- Real Device Icons -->
        <div class="flex items-center gap-4 text-white">
            <!-- Wifi Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
            </svg>
            
            <!-- Device Battery & Charging -->
            <div class="flex items-center gap-1">
                <span id="battery-text" class="text-xs font-semibold">--%</span>
                <!-- Battery Outline -->
                <div class="w-7 h-3.5 border border-white rounded-sm relative flex items-center p-[1px]">
                    <!-- Battery Fill (Width changed by JS) -->
                    <div id="battery-fill" class="h-full bg-white rounded-[1px] transition-all duration-500" style="width: 0%;"></div>
                    <!-- Battery Tip -->
                    <div class="absolute -right-[3px] top-1/2 -translate-y-1/2 w-[2px] h-1.5 bg-white rounded-r-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Clock and Date (Center) -->
    <div class="text-center z-10 pointer-events-none mt-10">
        <p id="date" class="text-lg md:text-xl text-white/90 font-semibold tracking-wide mb-1">Loading date...</p>
        <h1 id="clock" class="text-[7rem] leading-none font-bold tracking-tighter text-white drop-shadow-2xl">00:00</h1>
    </div>

    <!-- Empty Long-Press Ring (Bottom) -->
    <div class="w-full flex flex-col items-center z-10 mb-12">
        
        <div id="fingerprint-btn" class="relative flex items-center justify-center w-20 h-20 rounded-full bg-white/10 backdrop-blur-md border border-white/20 cursor-pointer select-none touch-none transition-transform duration-100 active:scale-95 group">
            
            <!-- SVG Progress Ring -->
            <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                <circle cx="40" cy="40" r="38" stroke="transparent" stroke-width="3" fill="transparent" />
                <circle id="progress-ring" cx="40" cy="40" r="38" stroke="#3b82f6" stroke-width="3" fill="transparent" stroke-dasharray="238" stroke-dashoffset="238" class="transition-all duration-75 ease-linear" />
            </svg>
        </div>
        <p class="mt-5 text-white/60 text-xs tracking-widest uppercase font-bold">Hold to Unlock</p>
    </div>
    
</div>
{% endblock %}

{% block extra_js %}
<script>
    // --- 1. WALLPAPER ROTATION (Every 24h) ---
    function setDailyWallpaper() {
        const wallpapers = [
            "{% static 'students/wallpapers/wallpaper1.jpg' %}",
            "{% static 'students/wallpapers/wallpaper2.jpg' %}",
            "{% static 'students/wallpapers/wallpaper3.jpg' %}",
            "{% static 'students/wallpapers/wallpaper4.jpg' %}"
        ];
        
        // Calculate day of the year (0 - 365)
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const oneDay = 1000 * 60 * 60 * 24;
        const dayOfYear = Math.floor(diff / oneDay);

        // Pick wallpaper based on day of year
        const wallpaperIndex = dayOfYear % wallpapers.length;
        
        // Apply the background image
        document.getElementById('lockscreen-bg').style.backgroundImage = `url('${wallpapers[wallpaperIndex]}')`;
    }
    setDailyWallpaper();

    // --- 2. REAL DEVICE BATTERY API ---
    function updateBattery() {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                const level = Math.round(battery.level * 100);
                const isCharging = battery.charging;
                
                const batteryText = document.getElementById('battery-text');
                const batteryFill = document.getElementById('battery-fill');
                
                // Update Text (shows lightning bolt if charging)
                batteryText.textContent = isCharging ? `⚡ ${level}%` : `${level}%`;
                
                // Update Fill Width
                batteryFill.style.width = `${level}%`;
                
                // Change color based on level
                if (level <= 20 && !isCharging) {
                    batteryFill.classList.replace('bg-white', 'bg-red-500');
                } else if (isCharging) {
                    batteryFill.classList.replace('bg-white', 'bg-green-400');
                } else {
                    batteryFill.classList.replace('bg-red-500', 'bg-white');
                    batteryFill.classList.replace('bg-green-400', 'bg-white');
                }
            });
        } else {
            // Fallback if browser doesn't support it
            document.getElementById('battery-text').textContent = "100%";
            document.getElementById('battery-fill').style.width = "100%";
        }
    }
    
    // Update battery on load, and whenever it changes
    updateBattery();
    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            battery.addEventListener('levelchange', updateBattery);
            battery.addEventListener('chargingchange', updateBattery);
        });
    }

    // --- 3. CLOCK ---
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-KE', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 4. LONG PRESS TO UNLOCK ---
    const btn = document.getElementById('fingerprint-btn');
    const progressRing = document.getElementById('progress-ring');
    let pressTimer;
    let progressTimer;
    let progress = 0;
    const maxProgress = 238; // Circumference of the circle
    const holdTime = 3000; // 3 seconds

    function startPress(e) {
        if(e) e.preventDefault();
        progress = 0;
        progressRing.style.strokeDashoffset = maxProgress;

        const intervalTime = 30; 
        const steps = holdTime / intervalTime;
        const stepSize = maxProgress / steps;

        progressTimer = setInterval(() => {
            progress += stepSize;
            progressRing.style.strokeDashoffset = maxProgress - progress;
        }, intervalTime);

        pressTimer = setTimeout(() => {
            clearInterval(progressTimer);
            btn.classList.replace('bg-white/10', 'bg-green-500/50');
            setTimeout(() => {
                window.location.href = '/students/student-login/';
            }, 200);
        }, holdTime);
    }

    function cancelPress(e) {
        if(e) e.preventDefault();
        clearTimeout(pressTimer);
        clearInterval(progressTimer);
        progressRing.style.strokeDashoffset = maxProgress;
        if (progress < maxProgress) {
            btn.classList.replace('bg-green-500/50', 'bg-white/10');
        }
    }

    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('mouseup', cancelPress);
    btn.addEventListener('mouseleave', cancelPress);
    btn.addEventListener('touchstart', startPress, {passive: false});
    btn.addEventListener('touchend', cancelPress);
    btn.addEventListener('touchcancel', cancelPress);
</script>
{% endblock %}
