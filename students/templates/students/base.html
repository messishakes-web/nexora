<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Booth</title>
    <!-- Tailwind CSS for beautiful styling without complex setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        html, body { overscroll-behavior-y: none; }
        /* Custom Nexora Brand colors */
        .bg-nexora-blue { background-color: #1e3a8a; } 
        .text-nexora-blue { color: #1e3a8a; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden flex flex-col">

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative w-full h-full">
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <!-- Global JS -->
    <script>
        // Prevent right-click on the kiosk
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
