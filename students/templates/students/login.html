
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora | Student Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #07111f;
    color: white;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-background {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 40%,
        #193553 0%, #0b1b2e 45%, #050b14 100%);
}

.login-container {
    position: relative;
    z-index: 2;
    width: 430px;
    max-width: 90%;
    padding: 45px;
    background: rgba(12, 27, 44, 0.88);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    box-shadow: 0 20px 70px rgba(0,0,0,0.45);
}

.brand {
    text-align: center;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 10px;
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    color: #9aadc1;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 38px;
}

.login-title {
    font-size: 25px;
    font-weight: 400;
    margin-bottom: 8px;
}

.login-description {
    color: #94a7bb;
    font-size: 13px;
    margin-bottom: 28px;
}

label {
    display: block;
    font-size: 13px;
    color: #c5d1df;
    margin-bottom: 9px;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    margin-bottom: 23px;
    background: #101f31;
    border: 1px solid #30445b;
    border-radius: 7px;
    color: white;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #51a5db;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 12px;
    top: 14px;
    border: none;
    background: none;
    color: #79b9e5;
    cursor: pointer;
}

.login-button {
    width: 100%;
    height: 49px;
    background: #168b62;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    margin-top: 5px;
}

.login-button:hover {
    background: #20a879;
}

.footer {
    text-align: center;
    color: #74879c;
    font-size: 11px;
    margin-top: 30px;
    letter-spacing: 1px;
}

@media(max-width: 600px) {
    .login-container {
        padding: 30px 24px;
    }
}
</style>
</head>

<body>

<div class="login-background"></div>

<div class="login-container">

    <div class="brand">NEXORA</div>
    <div class="subtitle">SCHOOL COMMUNICATION SYSTEM</div>

    <h2 class="login-title">Welcome Back</h2>

    <p class="login-description">
        Sign in to access your student account.
    </p>

    <form method="POST">
        {% csrf_token %}

        <label for="admission">Admission Number</label>
        <input
            type="text"
            id="admission"
            name="admission_number"
            placeholder="Enter your admission number"
            required
        >

        <label for="password">Password</label>

        <div class="password-wrapper">
            <input
                type="password"
                id="pin"
                name="pin"
                placeholder="Enter your pin"
                required
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
                >
                Show
            </button>
        </div>

        <button type="submit" class="login-button">
            SIGN IN
        </button>
    </form>

    <div class="footer">
        NEXORA TECHNOLOGY · SECURE STUDENT ACCESS
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}
</script>

</body>
</html>
