{% extends 'students/base.html' %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center p-6 h-full">

    <!-- Back Button to Lockscreen -->
    <a href="{% url 'booth-lockscreen' %}" class="absolute top-8 left-8 text-gray-400 hover:text-white flex items-center gap-2 text-lg font-semibold transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Back
    </a>

    <div class="w-full max-w-md bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-700">
        <h2 class="text-3xl font-bold text-center mb-2">Student Login</h2>
        <p class="text-gray-400 text-center mb-8">Enter your details to start calling</p>

        <!-- Django Messages (For errors) -->
        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded-xl mb-6 text-center font-semibold animate-pulse">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="loginForm">
            {% csrf_token %}
            
            <!-- Admission Number Input -->
            <div class="mb-6">
                <label class="block text-gray-400 text-sm font-bold mb-2 ml-1">Admission Number</label>
                <input type="text" name="admission_number" id="admissionNumber" required
                    class="w-full bg-gray-900 text-white text-2xl tracking-widest px-4 py-4 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/50 border border-gray-700"
                    placeholder="e.g. 1024">
            </div>

            <!-- Hidden PIN Input (The actual form submits this) -->
            <div class="mb-6">
                <label class="block text-gray-400 text-sm font-bold mb-2 ml-1">PIN</label>
                <input type="password" name="pin" id="pinInput" required
                    class="w-full bg-gray-900 text-white text-center text-4xl tracking-[1em] px-4 py-4 rounded-xl border border-gray-700 focus:outline-none"
                    readonly> <!-- Readonly so they MUST use the keypad -->
            </div>

            <!-- Custom Touch Number Pad -->
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button type="button" onclick="pressNum('1')" class="numpad-btn">1</button>
                <button type="button" onclick="pressNum('2')" class="numpad-btn">2</button>
                <button type="button" onclick="pressNum('3')" class="numpad-btn">3</button>
                <button type="button" onclick="pressNum('4')" class="numpad-btn">4</button>
                <button type="button" onclick="pressNum('5')" class="numpad-btn">5</button>
                <button type="button" onclick="pressNum('6')" class="numpad-btn">6</button>
                <button type="button" onclick="pressNum('7')" class="numpad-btn">7</button>
                <button type="button" onclick="pressNum('8')" class="numpad-btn">8</button>
                <button type="button" onclick="pressNum('9')" class="numpad-btn">9</button>
                <button type="button" onclick="clearPin()" class="numpad-btn text-red-400 hover:text-red-300">Clear</button>
                <button type="button" onclick="pressNum('0')" class="numpad-btn">0</button>
                <button type="button" onclick="deletePin()" class="numpad-btn text-yellow-400 hover:text-yellow-300">⌫</button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xl py-5 rounded-2xl transition shadow-[0_0_30px_rgba(37,99,235,0.4)]">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
    /* Styling for the number pad buttons */
    .numpad-btn {
        background-color: #1f2937; /* bg-gray-800 */
        padding: 1.25rem 0;
        font-size: 1.75rem;
        font-weight: bold;
        border-radius: 1rem;
        border: 1px solid #374151; /* border-gray-700 */
        transition: all 0.1s;
    }
    .numpad-btn:active {
        background-color: #374151;
        transform: scale(0.95);
    }
</style>

<script>
    const pinInput = document.getElementById('pinInput');
    const admissionNumber = document.getElementById('admissionNumber');

    // When a number is clicked on the keypad
    function pressNum(num) {
        if (pinInput.value.length < 4) { // Max 4 digits
            pinInput.value += num;
        }
    }

    // Backspace
    function deletePin() {
        pinInput.value = pinInput.value.slice(0, -1);
    }

    // Clear all
    function clearPin() {
        pinInput.value = '';
    }

    // Focus on admission number by default so they can type it
    admissionNumber.focus();
</script>
{% endblock %}
